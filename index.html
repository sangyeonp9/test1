<!DOCTYPE html>

<body>

  <!-- Ticker Tape -->
  <div id="ticker-wrap">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          {"proName": "FOREXCOM:SPXUSD", "title": "S&P 500"},
          {"proName": "FOREXCOM:NSXUSD", "title": "NASDAQ 100"},
          {"description": "DOW Jones", "proName": "FOREXCOM:DJI"},
          {"description": "KOSPI", "proName": "KRX:KOSPI"},
          {"description": "NIKKEI 225", "proName": "TVC:NI225"},
          {"description": "HANG SENG", "proName": "TVC:HSI"},
          {"description": "Gold", "proName": "TVC:GOLD"},
          {"description": "WTI Oil", "proName": "TVC:USOIL"},
          {"description": "BTC/USD", "proName": "BITSTAMP:BTCUSD"},
          {"description": "ETH/USD", "proName": "BITSTAMP:ETHUSD"},
          {"description": "USD/KRW", "proName": "FX_IDC:USDKRW"}
        ],
        "showSymbolLogo": true,
        "isTransparent": true,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "kr"
      }
      </script>
    </div>
  </div>

  <!-- Header -->
  <header id="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">📈</span>
        <span class="logo-text">Financial Dashboard</span>
        <span class="logo-sub">실시간 금융 분석</span>
      </div>
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="indices">주요 지수</button>
        <button class="tab-btn" data-tab="stocks">개별 종목</button>
        <button class="tab-btn" data-tab="commodities">원자재/외환</button>
        <button class="tab-btn" data-tab="crypto">암호화폐</button>
      </nav>
      <div class="market-status" id="market-status">
        <span class="status-dot"></span>
        <span class="status-text">Market</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->

    <!-- Tab: 주요 지수 -->
    <section class="tab-section active" id="tab-indices">

      <div class="section-row">
        <div class="main-chart-container card">
          <div class="card-header">
            <h2 class="card-title" id="main-chart-title">S&amp;P 500</h2>
            <div class="symbol-buttons">
              <button class="sym-btn active" data-sym="FOREXCOM:SPXUSD" data-name="S&amp;P 500">SPX</button>
              <button class="sym-btn" data-sym="FOREXCOM:NSXUSD" data-name="NASDAQ 100">NDX</button>
              <button class="sym-btn" data-sym="FOREXCOM:DJI" data-name="DOW Jones">DJI</button>
              <button class="sym-btn" data-sym="KRX:KOSPI" data-name="KOSPI">KOSPI</button>
              <button class="sym-btn" data-sym="TVC:NI225" data-name="NIKKEI 225">N225</button>
              <button class="sym-btn" data-sym="TVC:HSI" data-name="HANG SENG">HSI</button>
            </div>
          </div>
          <div class="tradingview-widget-container" id="main-chart-widget" style="height:520px;">
            <div id="tradingview_main" style="height:100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js" async></script>
          </div>
        </div>
      </div>

                "symbol": "FOREXCOM:SPXUSD",
                "width": "100%",
                "height": "200",
                "locale": "kr",
                "dateRange": "12M",
                "colorTheme": "dark",
                "isTransparent": true,
                "autosize": true,
                "largeChartUrl": ""

          </div>
